<!DOCTYPE html>
<html>

<head>
    <title>Doc2Markdown AI</title>

    <style>

        body{
            font-family: Arial, sans-serif;
            background:#f4f4f4;
            text-align:center;
            padding:50px;
        }

        .card{
            background:white;
            width:550px;
            margin:auto;
            padding:30px;
            border-radius:15px;
            box-shadow:0 0 15px rgba(0,0,0,0.1);
        }

        button{
            background:#2563eb;
            color:white;
            border:none;
            padding:12px 25px;
            border-radius:8px;
            cursor:pointer;
        }

        button:hover{
            background:#1d4ed8;
        }

    </style>

</head>

<body>

<div class="card">

    <h1>🚀 Doc2Markdown AI</h1>

    <p>
        Convert PDF and DOCX files into Markdown.
    </p>

    <form
        action="/upload"
        method="POST"
        enctype="multipart/form-data"
    >

        <input
            type="file"
            name="file"
            required
        >

        <br><br>

        <button type="submit">
            Convert File
        </button>

    </form>

</div>

</body>

</html>
