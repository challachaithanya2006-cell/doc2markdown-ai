<!DOCTYPE html>
<html>
<head>
    <title>Doc2Markdown AI</title>

    <style>

        body{
            font-family: Arial;
            background:#f4f4f4;
            text-align:center;
            padding:50px;
        }

        .card{
            background:white;
            padding:30px;
            border-radius:12px;
            width:500px;
            margin:auto;
            box-shadow:0 0 10px rgba(0,0,0,0.1);
        }

        button{
            background:#2563eb;
            color:white;
            border:none;
            padding:10px 20px;
            border-radius:8px;
            cursor:pointer;
        }

    </style>

</head>

<body>

<div class="card">

    <h1>🚀 Doc2Markdown AI</h1>

    <p>
        Convert PDF files into Markdown.
    </p>

    <form
        action="/upload"
        method="POST"
        enctype="multipart/form-data"
    >

        <input
            type="file"
            name="file"
            required
        >

        <br><br>

        <button type="submit">
            Convert PDF
        </button>

    </form>

</div>

</body>
</html>
